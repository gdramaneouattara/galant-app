name: Deploy Server to Cloud Run

on:
  push:
    branches: [ main, staging ]
    paths:
      - 'server/**'
      - 'firebase.json'
      - 'firestore.indexes.json'
      - '.github/workflows/deploy-server.yml'

env:
  PROJECT_ID: galant-af393
  SERVICE_NAME: galant-backend
  REGION: europe-west4

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy Firestore indexes
        run: npx -y firebase-tools@latest deploy --only firestore:indexes --project ${{ env.PROJECT_ID }} --non-interactive

      - name: Wait for Firestore indexes
        run: |
          for attempt in {1..60}; do
            if gcloud firestore indexes composite list --project "${{ env.PROJECT_ID }}" --format=json | node -e "
              let input = '';
              process.stdin.on('data', chunk => input += chunk);
              process.stdin.on('end', () => {
                const indexes = JSON.parse(input || '[]');
                const ready = indexes.some(index => {
                  const fields = index.fields || [];
                  const collectionMatches = index.collectionGroup === 'manual_payments'
                    || String(index.name || '').includes('/collectionGroups/manual_payments/');
                  return collectionMatches
                    && index.queryScope === 'COLLECTION'
                    && index.state === 'READY'
                    && fields.some(field => field.fieldPath === 'status' && field.order === 'ASCENDING')
                    && fields.some(field => field.fieldPath === 'created_at' && field.order === 'ASCENDING');
                });
                process.exit(ready ? 0 : 1);
              });
            "; then
              echo "Firestore manual_payments index is ready."
              exit 0
            fi
            echo "Waiting for Firestore manual_payments index to become READY... ($attempt/60)"
            sleep 10
          done
          echo "Firestore manual_payments index was not ready in time."
          exit 1

      - name: Build and Push Container
        run: |
          # Use different tag for staging
          TAG=${{ github.ref == 'refs/heads/main' && 'latest' || 'staging' }}
          gcloud builds submit --tag gcr.io/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}:$TAG server/

      - name: Deploy to Cloud Run
        run: |
          # Use different service name for staging
          SERVICE=${{ github.ref == 'refs/heads/main' && env.SERVICE_NAME || format('{0}-staging', env.SERVICE_NAME) }}
          TAG=${{ github.ref == 'refs/heads/main' && 'latest' || 'staging' }}
          
          gcloud run deploy $SERVICE \
            --image gcr.io/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}:$TAG \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --min-instances 0 \
            --max-instances 10 \
            --memory 512Mi \
            --cpu 1 \
            --concurrency 80 \
            --timeout 120s \
            --update-env-vars "NODE_ENV=production,ALLOWED_ORIGINS=*,PAYSTACK_ENABLED=false,WAVE_MANUAL_PAYMENT_EXPIRES_MINUTES=60" \
            --remove-secrets PAYSTACK_SECRET_KEY \
            --update-secrets "JWT_SECRET=JWT_SECRET:latest,FIREBASE_DATABASE_URL=FIREBASE_DATABASE_URL:latest,FIREBASE_STORAGE_BUCKET=FIREBASE_STORAGE_BUCKET:latest,EXPO_PUSH_ACCESS_TOKEN=EXPO_PUSH_ACCESS_TOKEN:latest,YANGO_API_KEY=YANGO_API_KEY:latest,GOOGLE_MAPS_API_KEY=GOOGLE_MAPS_API_KEY:latest,WAVE_PAYMENT_LINK=WAVE_PAYMENT_LINK:latest,WAVE_RECEIVER_NAME=WAVE_RECEIVER_NAME:latest,WAVE_RECEIVER_PHONE=WAVE_RECEIVER_PHONE:latest"
