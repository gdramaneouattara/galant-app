<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/galant-logo-web.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <!-- PWA Primary Meta Tags -->
    <title>Galant - L'élégance à chaque rencontre</title>
    <meta name="description" content="La première plateforme de rencontre premium en Afrique Centrale.">
    <meta name="theme-color" content="#ef4444">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- iOS support -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Galant">
    <link rel="apple-touch-icon" href="/galant-logo-web.png">
  </head>
  <body class="text-slate-900 overflow-x-hidden">
    <div id="debug-error" style="display:none; color:white; background:red; padding:10px; position:fixed; top:0; left:0; right:0; z-index:9999; font-family:monospace; font-size:12px; white-space:pre-wrap; max-height: 50vh; overflow: auto;"></div>
    <script>
      window.onerror = function(msg, url, line, col, error) {
        var div = document.getElementById('debug-error');
        div.style.display = 'block';
        div.textContent = 'Global Error: ' + msg + '\nFile: ' + url + '\nLine: ' + line + ':' + col + (error ? '\nStack: ' + error.stack : '');
      };
      window.onunhandledrejection = function(event) {
        var div = document.getElementById('debug-error');
        div.style.display = 'block';
        div.textContent = 'Unhandled Rejection: ' + event.reason;
      };
    </script>

    <div id="root">
      <div id="galant-boot-loader" style="height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: Inter, system-ui, sans-serif; background-color: #0f172a; color: white;">
        <div style="width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.3); border-top-color: #ef4444; border-radius: 50%; animation: galant-spin 1s linear infinite; margin-bottom: 20px;"></div>
        <style>@keyframes galant-spin { to { transform: rotate(360deg); } }</style>
        <div style="font-family: 'Playfair Display', serif; font-weight: 900; font-size: 24px; font-style: italic;">GALANT</div>
        <div style="font-size: 10px; text-transform: uppercase; letter-spacing: 0.14em; opacity: 0.5; margin-top: 10px;">L'élégance patiente...</div>
      </div>
    </div>
    <script>
      (function () {
        var RECOVERY_KEY = 'galant_pwa_boot_recovery_at';
        var RECOVERY_WINDOW_MS = 60000;
        var BOOT_TIMEOUT_MS = 14000;
        var PRESERVED_CACHES = ['galant-media-cache', 'galant-remote-image-cache'];

        function isStandalone() {
          return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
        }

        function shouldRecover() {
          var root = document.getElementById('root');
          return !window.__GALANT_APP_BOOTED && !!root && !!document.getElementById('galant-boot-loader');
        }

        async function clearBuildCaches() {
          if (!('caches' in window)) return;
          var names = await window.caches.keys();
          await Promise.all(names.filter(function (name) {
            return PRESERVED_CACHES.indexOf(name) === -1;
          }).map(function (name) {
            return window.caches.delete(name);
          }));
        }

        function getGalantServiceWorkerScope() {
          var path = window.location.pathname || '/';
          var scopePath = path.indexOf('/galant-app/') === 0 ? '/galant-app/' : '/';
          return new URL(scopePath, window.location.origin).toString();
        }

        async function unregisterServiceWorkers() {
          if (!('serviceWorker' in navigator)) return;
          var galantScope = getGalantServiceWorkerScope();
          var registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.filter(function (registration) {
            return registration.scope === galantScope;
          }).map(function (registration) {
            return registration.unregister().catch(function () {});
          }));
        }

        async function recover() {
          var lastAttempt = Number(sessionStorage.getItem(RECOVERY_KEY) || 0);
          if (Date.now() - lastAttempt < RECOVERY_WINDOW_MS) return;
          sessionStorage.setItem(RECOVERY_KEY, String(Date.now()));
          await Promise.allSettled([clearBuildCaches(), unregisterServiceWorkers()]);
          var url = new URL(window.location.href);
          url.searchParams.set('pwa_recover', String(Date.now()));
          window.location.replace(url.toString());
        }

        window.setTimeout(function () {
          if (!isStandalone() || !shouldRecover()) return;
          recover().catch(function () {});
        }, BOOT_TIMEOUT_MS);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
